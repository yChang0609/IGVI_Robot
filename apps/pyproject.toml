[project]
name = "igvi-apps"
version = "0.1.0"
description = "IGVI Robot local UI and host agent"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "docker>=7.1",
  "python-on-whales>=0.72",
  "websockets>=12.0",
  "pyqtgraph>=0.13",
  "vispy>=0.14",
  "pytest>=8.0",
]

[project.scripts]
igvi-host = "igvi_host.server:main"
igvi-ui = "igvi_ui.app:main"
igvi-app = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["igvi_host", "igvi_ui"]
include = ["main.py"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
