name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro
x-grasp-source-volume: &grasp_source_volume ../../../robot_ws/src/wildbot_grasp:/workspace/src/wildbot_grasp:ro
x-tuner-output-volume: &tuner_output_volume ../../../tuner_output:/tuner_output

services:
  wildbot_grasp:
    <<: *base_service
    profiles: ["grasp"]
    x-description: "High-level grasp action server for the arm/gripper"
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.grasp
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
      - *tuner_output_volume
    restart: unless-stopped

  arm_safeguard:
    <<: *base_service
    profiles: ["grasp"]
    x-description: "Hardware safety proxy and cooler for the arm/gripper"
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
      - *tuner_output_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp arm_safeguard_node"]
    restart: unless-stopped

  open_door_server:
    <<: *base_service
    profiles: ["grasp", "open_door"]
    x-description: "Vision-guided door-opening FSM (consumes /detections_json from eto_eye)"
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
      - *tuner_output_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp open_door_server"]
    restart: unless-stopped

networks:
  robot_net:
    driver: bridge
