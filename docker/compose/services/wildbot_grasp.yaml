name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro
x-grasp-source-volume: &grasp_source_volume ../../../robot_ws/src/wildbot_grasp:/workspace/src/wildbot_grasp:ro
x-maps-volume: &maps_volume ${IGVI_DATA_ROOT}/maps:/maps:ro

services:
  wildbot_grasp:
    <<: *base_service
    profiles: ["robot"]
    x-description: "Unified grasp stack: action server, arm safeguard, bear task, and nav topic interface"
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.grasp
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp grasp_stack"]
    restart: unless-stopped

  bridge_retrieve:
    <<: *base_service
    profiles: ["task_server"]
    x-description: "Bridge-center waypoint + YOLO xiong_qiao retrieval mission"
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp bridge_retrieve_launch"]
    restart: unless-stopped

  search_retrieve_server:
    <<: *base_service
    profiles: ["task_server"]
    x-description: "Search and retrieve action server for Wildbot"
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp search_retrieve_launch"]
    restart: unless-stopped

  arena_mission_server:
    <<: *base_service
    profiles: ["grasp"]
    x-description: "Arena capture mission orchestrator"
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
      - *maps_volume
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run wildbot_grasp arena_mission_launch"]
    restart: unless-stopped

networks:
  robot_net:
    driver: bridge
