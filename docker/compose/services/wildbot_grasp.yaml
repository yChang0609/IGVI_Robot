name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro
x-grasp-source-volume: &grasp_source_volume ../../../robot_ws/src/wildbot_grasp:/workspace/src/wildbot_grasp:ro

services:
  wildbot_grasp:
    <<: *base_service
    profiles: ["grasp"]
    x-description: "High-level grasp action server for the arm/gripper"
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.grasp
    image: wildbot_grasp:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *grasp_source_volume
    restart: unless-stopped

networks:
  robot_net:
    driver: bridge
