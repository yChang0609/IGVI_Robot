name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro

services:
  igvi_bridge:
    <<: *base_service
    profiles: ["communication"]
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.bridge
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - ${IGVI_DATA_ROOT}/maps:/maps
      - ${IGVI_DATA_ROOT}/slam:/slam
      - ../../../robot_ws/src/igvi_bridge/igvi_bridge:/workspace/src/igvi_bridge/igvi_bridge:ro
    ports:
      - "8771:8771"
    restart: unless-stopped

networks:
  robot_net:
    driver: bridge
