name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

services:
  rosbridge:
    <<: *base_service
    profiles: ["communication"]
    image: ghcr.io/screamlab/wildbot_base_image:latest
    ports:
      - 9090:9090
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml delay_between_messages:=0.0

networks:
  robot_net:
    driver: bridge
