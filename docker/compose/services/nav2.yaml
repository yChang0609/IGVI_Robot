name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro
x-launch-volume: &launch_volume ../../../robot_ws/launch:/launch:ro

services:
  nav2:
    <<: *base_service
    profiles: ["application"]
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.fusion
    image: wildbot_slam_fusion:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *launch_volume
    # Planning-only stack: map_server + amcl + planner_server + bt_navigator
    # (with plan_only BT). The controller_server / behavior_server /
    # velocity_smoother are intentionally omitted — motion_arbiter executes paths.
    command:
      - ros2
      - launch
      - /launch/nav2_planning_only.launch.py

networks:
  robot_net:
    driver: bridge
