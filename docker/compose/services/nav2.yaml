name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro

services:
  nav2:
    <<: *base_service
    profiles: ["navigation"]
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.fusion
    image: wildbot_slam_fusion:latest
    volumes:
      - *config_volume
    command:
      - ros2
      - launch
      - nav2_bringup
      - navigation_launch.py
      - use_sim_time:=false
      - params_file:=/configs/nav2_params.yaml

networks:
  robot_net:
    driver: bridge
