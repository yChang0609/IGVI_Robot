name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/src/wildbot_bringup/config:/configs:ro

services:
  camera_kinect:
    <<: *base_service
    profiles: ["sensors", "kinect"]
    build:
      context: ../../..
      dockerfile: docker/images/kinect/Dockerfile
    image: wildbot_kinect:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - *config_volume
      - /dev/shm:/dev/shm
    command:
      - /bin/bash
      - -c
      - >-
        ros2 run azure_kinect_ros_driver node --ros-args
        -p depth_enabled:=true
        -p color_enabled:=true
        -p color_resolution:=720P
        -p depth_mode:=NFOV_UNBINNED
        -p fps:=15
        -p imu_rate_target:=0
        -p point_cloud:=true
        -p rgb_point_cloud:=true

networks:
  robot_net:
    driver: bridge
