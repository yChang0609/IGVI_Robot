name: igvi_robot

x-base-service: &base_service
  env_file:
    - ../.env
  networks:
    - robot_net

x-config-volume: &config_volume ../../../robot_ws/configs:/configs:ro
x-launch-volume: &launch_volume ../../../robot_ws/launch:/workspace/launch:ro
x-igvi-imu-volume: &igvi_imu_volume ../../../robot_ws/src/igvi_imu/igvi_imu:/workspaces/src/igvi_imu/igvi_imu:ro

services:
  slam_fusion:
    <<: *base_service
    profiles: ["slam_system"]
    build:
      context: ../../..
      dockerfile: docker/images/Dockerfile.fusion
    image: wildbot_slam_fusion:latest
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /configs/fastdds_shm.xml
    volumes:
      - *config_volume
      - *launch_volume
      - ${IGVI_DATA_ROOT}/slam:/root/.ros
      - *igvi_imu_volume
    command:
      - /bin/bash
      - -c
      - >-
        source /workspaces/install/setup.bash &&
        ros2 launch /workspace/launch/slam_fusion.launch.py
        delete_db_on_start:=true

networks:
  robot_net:
    driver: bridge
