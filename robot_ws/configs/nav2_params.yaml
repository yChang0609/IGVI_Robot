bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Custom plan-only BT: skip FollowPath (motion_arbiter executes paths).
    default_nav_to_pose_bt_xml: /configs/plan_only_bt.xml
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3       # start conservative, can increase later
      max_linear_accel: 0.4
      max_angular_accel: 1.2
      lookahead_dist: 0.4
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3                # how close to goal counts as "arrived" (meters)
      use_astar: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22            # TUNE THIS — measure your actual robot width / 2
      rolling_window: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35      # how far from obstacles to avoid — reduce for bridge

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.05
      initial_transform_timeout: 120.0
      transform_tolerance: 1.0
      map_subscribe_transient_local: true
      map_topic: /map
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
      # Live/dynamic obstacles. Kinect points2 covers the FRONT (lidar only sees
      # the rear). Both sources mark obstacles into the costmap and ray-trace to
      # clear them as they move — they never touch RTAB-Map's static /map.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 1.5
        combination_method: 1
        observation_sources: kinect_cloud rear_scan
        kinect_cloud:
          topic: /points2
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05   # ignore the floor
          max_obstacle_height: 1.5
          obstacle_max_range: 3.0     # trust Kinect depth out to ~3 m
          obstacle_min_range: 0.18    # ignore held object (~0.24m grab dist); tune if needed
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
        rear_scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
