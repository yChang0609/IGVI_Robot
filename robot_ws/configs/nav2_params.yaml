bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Custom plan-only BT: skip FollowPath (motion_arbiter executes paths).
    default_nav_to_pose_bt_xml: /configs/plan_only_bt.xml
    plugin_lib_names: []

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3       # start conservative, can increase later
      max_linear_accel: 0.4
      max_angular_accel: 1.2
      lookahead_dist: 0.4
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3                # how close to goal counts as "arrived" (meters)
      use_astar: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22            # TUNE THIS — measure your actual robot width / 2
      rolling_window: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25      # how far from obstacles to avoid — reduce for bridge

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.05
      map_subscribe_transient_local: true
      map_topic: /map
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
