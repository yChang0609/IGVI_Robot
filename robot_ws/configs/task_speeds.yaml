# Task-level speed presets.
#
# linear values are m/s; angular values are rad/s.
# These are per-task desired limits. They remain bounded by motion_arbiter and
# base_controller safety limits.

search_retrieve_server:
  ros__parameters:
    transit_linear_speed: 0.25
    transit_angular_speed: 0.45
    approach_linear_speed: 0.05
    approach_angular_speed: 0.30
    carry_linear_speed: 0.16
    carry_angular_speed: 0.30

bridge_retrieve_server:
  ros__parameters:
    transit_linear_speed: 0.18
    transit_angular_speed: 0.35
    approach_linear_speed: 0.05
    approach_angular_speed: 0.25
    carry_linear_speed: 0.12
    carry_angular_speed: 0.22

bridge_traverse_server:
  ros__parameters:
    transit_linear_speed: 0.18
    transit_angular_speed: 0.35
    approach_linear_speed: 0.05
    approach_angular_speed: 0.25
    carry_linear_speed: 0.16
    carry_angular_speed: 0.30

open_door_server:
  ros__parameters:
    approach_speed: 0.05
    approach_max_wz: 0.25

igvi_bridge:
  ros__parameters:
    door_transit_linear_speed: 0.18
    door_transit_angular_speed: 0.35
