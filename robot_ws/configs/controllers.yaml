controller_manager:
  ros__parameters:
    # Keep this low enough for the arm TTL serial bus. During a 1s trajectory,
    # joint_trajectory_controller produces a new interpolated arm position every
    # control tick; at 50 Hz the hardware plugin can queue servo writes faster
    # than the 3-servo command packet can be sent, causing "Arm cmd tx slow/fail".
    update_rate: 15

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

base_controller:
  ros__parameters:
    left_wheel_names: ["wheel_1_joint", "wheel_2_joint"]
    right_wheel_names: ["wheel_3_joint", "wheel_4_joint"]

    wheel_separation: 0.274
    wheel_separation_multiplier: 2.21


    wheel_radius: 0.05035

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false
    cmd_vel_timeout: 0.5

    # robot_localization rejects / mis-weights messages whose covariance is all
    # zero (the diff_drive_controller default), which is why /base_controller/odom
    # could not be fused before. These diagonals [x, y, z, roll, pitch, yaw] make
    # the EKF treat wheel data as a moderately trusted velocity source while the
    # slip-prone lateral/rotational terms are deweighted (IMU gyro owns yaw,
    # RTAB-Map owns absolute drift). Starting values — tune per memo.md.
    pose_covariance_diagonal:  [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal: [0.04,  1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.06]

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.546
        has_acceleration_limits: true
        max_acceleration: 0.5
        has_deceleration_limits: true
        max_deceleration: -1.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.983
        has_acceleration_limits: true
        max_acceleration: 1.0
        has_deceleration_limits: true
        max_deceleration: -3.0

arm_controller:
  ros__parameters:
    joints:
      - arm_1_joint
      - arm_2_joint
      - gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 15.0
    action_monitor_rate: 10.0
    allow_partial_joints_goal: false
